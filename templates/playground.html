{% extends "base.html" %}
{% block title %}Playground — CAD 167{% endblock %}

{% block content %}
<aside class="sidebar">
  <section class="sb-section">
    <label class="sb-label">ATIVOS (ctrl+clique)</label>
    <select id="setor-filter" class="sb-input" style="margin-bottom:6px">
      <option value="">Todos os setores</option>
      {% for setor in setores %}
        <option value="{{ setor }}">{{ setor }}</option>
      {% endfor %}
    </select>
    <div class="add-row">
      <input id="add-ticker" class="sb-input" type="text" placeholder="Adicionar ticker">
      <button id="btn-add" class="btn-mini">+ Add</button>
    </div>
    <select id="ticker-select" class="ticker-list" multiple size="9">
      {% for t in tickers_default %}
        <option value="{{ t }}" {% if t in tickers_inicial %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
  </section>

  <script>
    window.SETORES      = {{ setores | tojson }};
    window.ALL_TICKERS  = {{ tickers_default | tojson }};
  </script>

  <section class="sb-section">
    <label class="sb-label">PERÍODO IN-SAMPLE (treinamento)</label>
    <div style="display:flex;gap:4px;align-items:center;margin-bottom:4px">
      <span style="font-size:9px;color:var(--fg-dim);width:32px">Início</span>
      <input id="dt-inicio" class="sb-input" type="date" value="2018-01-01" style="flex:1">
    </div>
    <div style="display:flex;gap:4px;align-items:center">
      <span style="font-size:9px;color:var(--fg-dim);width:32px">Corte</span>
      <input id="dt-corte" class="sb-input" type="date" value="2022-01-01" style="flex:1">
    </div>
  </section>

  <section class="sb-section">
    <label class="sb-label">PERÍODO OUT-OF-SAMPLE (simulação)</label>
    <div style="display:flex;gap:4px;align-items:center">
      <span style="font-size:9px;color:var(--fg-dim);width:32px">Fim</span>
      <input id="dt-fim" class="sb-input" type="date" value="2025-12-31" style="flex:1">
    </div>
  </section>

  <section class="sb-section">
    <label class="sb-label">ESTRATÉGIA DE ALOCAÇÃO</label>
    <div class="radio-row">
      <label class="radio-btn">
        <input type="radio" name="estrategia" value="max_sharpe" checked>Max-Sharpe
      </label>
      <label class="radio-btn">
        <input type="radio" name="estrategia" value="min_vol">Min-Vol
      </label>
      <label class="radio-btn">
        <input type="radio" name="estrategia" value="naive">1/N
      </label>
    </div>
  </section>

  <section class="sb-section">
    <label class="sb-label">TAXA LIVRE DE RISCO (% a.a.)</label>
    <input id="rf-input" class="sb-input" type="number" step="0.01"
           value="{{ rf_default }}" min="0" max="100">
  </section>

  <button id="btn-simular" class="btn-primary">▶ Simular</button>
  <div id="status" class="status-msg"></div>
</aside>

<main class="main-content" style="display:flex;flex-direction:column;overflow-y:auto">
  <div id="chart-is"  class="chart-area" style="flex:0 0 45%;min-height:260px"></div>
  <div id="metrics-bar" class="metrics-bar" style="display:none"></div>
  <div id="chart-oos" class="chart-area" style="flex:0 0 45%;min-height:260px"></div>
  <div id="table-wrap" class="table-wrap"></div>
</main>

<script src="{{ url_for('static', filename='playground.js') }}"></script>
{% endblock %}
