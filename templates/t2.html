{% extends "base.html" %}
{% block title %}Fronteira Eficiente — CAD 167{% endblock %}

{% block content %}
<aside class="sidebar">
  <section class="sb-section">
    <label class="sb-label">ATIVOS (ctrl+clique)</label>
    <select id="setor-filter" class="sb-input" style="margin-bottom:6px">
      <option value="">Todos os setores</option>
      {% for setor in setores %}
        <option value="{{ setor }}">{{ setor }}</option>
      {% endfor %}
    </select>
    <div class="add-row">
      <input id="add-ticker" class="sb-input" type="text" placeholder="Adicionar ticker">
      <button id="btn-add" class="btn-mini">+ Add</button>
    </div>
    <select id="ticker-select" class="ticker-list" multiple size="11">
      {% for t in tickers_default %}
        <option value="{{ t }}" {% if t in tickers_inicial %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
  </section>

  <script>
    window.SETORES      = {{ setores | tojson }};
    window.ALL_TICKERS  = {{ tickers_default | tojson }};
    window.INIT_TICKERS = {{ tickers_inicial | tojson }};
  </script>

  <section class="sb-section">
    <label class="sb-label">PERÍODO HISTÓRICO</label>
    <div class="radio-row">
      {% for p in periodos %}
        <label class="radio-btn">
          <input type="radio" name="periodo" value="{{ p }}"
                 {% if p == '5A' %}checked{% endif %}>
          {{ p }}
        </label>
      {% endfor %}
    </div>
  </section>

  <section class="sb-section">
    <label class="sb-label">TAXA LIVRE DE RISCO (% a.a.)</label>
    <input id="rf-input" class="sb-input" type="number" step="0.01"
           value="{{ rf_default }}" min="0" max="100">
  </section>

  <button id="btn-calcular" class="btn-primary">▶ Calcular</button>
  <button id="btn-relatorio" class="btn-secondary" disabled>⬇ Exportar Relatório</button>
  <div id="status" class="status-msg"></div>

  <hr class="sb-sep">
  <label class="sb-label">GLOSSÁRIO</label>
  <div class="glossary">
    {% for nome, desc in glossario %}
      <div class="glos-item">
        <span class="glos-title">{{ nome }}</span>
        <span class="glos-body">{{ desc }}</span>
      </div>
    {% endfor %}
  </div>
</aside>

<main class="main-content" style="display:flex;flex-direction:column">
  <div id="chart" class="chart-area" style="flex:1;min-height:0"></div>
  <div id="table-wrap" class="table-wrap"></div>
</main>

<script src="{{ url_for('static', filename='t2.js') }}"></script>
{% endblock %}
